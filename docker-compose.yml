# Production-like deployment: a single container serving API + SPA.
#   docker compose up --build
# Then create the first superuser:
#   docker compose exec app /pb/pocketbase superuser upsert admin@example.com <password> --dir=/pb/pb_data
services:
  app:
    build: .
    ports:
      - '8090:8090'
    environment:
      # Public URL of the app, used in verification and password-reset emails.
      APP_URL: ${APP_URL:-http://localhost:8090}
      MAIL_SENDER_ADDRESS: ${MAIL_SENDER_ADDRESS:-}
      MAIL_SENDER_NAME: ${MAIL_SENDER_NAME:-Judge26}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      # Automatic backups (docs/operations/backup-and-restore.md); "off" disables them.
      BACKUP_CRON: '${BACKUP_CRON:-30 3 * * *}'
      BACKUP_MAX_KEEP: ${BACKUP_MAX_KEEP:-14}
    volumes:
      - pb_data:/pb/pb_data
    restart: unless-stopped

volumes:
  pb_data:
